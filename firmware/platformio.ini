; Boop firmware (plan/DEVICE.md §4). Build through tools/pio.sh, which keeps
; PlatformIO's packages inside this checkout:
;   firmware/tools/pio.sh run -e cyd24        (or `make fw` from the repo root)
;   firmware/tools/pio.sh test -e native      (or `make fw-test`)
[platformio]
default_envs = cyd24

; MicroTech MTR024QV01A (ESP32-D0WD-V3, 4 MB flash, no PSRAM).
[env:cyd24]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
; The CH340 bridge on macOS's own driver can't do 921600 (DEVICE.md §7).
monitor_speed = 460800
upload_speed = 460800
extra_scripts = pre:tools/version.py
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -Iassets
build_src_filter = +<board/> +<render/> +<app/> +<link/> +<voice/> +<main.cpp>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.2.0

; The Mac: firmware unit tests and the simulator (boop-sim). Only the pure
; C++ parts build here: render/, app/ and voice/.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Isrc
    -Iassets
    -DBOOP_NATIVE=1
build_src_filter = +<render/> +<app/> +<voice/> +<sim/>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
