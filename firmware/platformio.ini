; Boop firmware (documentation/DEVICE.md §4): Boop's app in src/, on LinkKit's device
; library (../linkkit/device, linked in by lib_deps below; it checks it never
; includes Boop's headers). Build through tools/pio.sh, which keeps
; PlatformIO's packages inside this checkout:
;   firmware/tools/pio.sh run -e cyd24        (or -e amoled206; `make -C internal fw` builds both)
;   firmware/tools/pio.sh test -e native      (or `make -C internal fw-test`)
[platformio]
default_envs = cyd24
; The unit tests and the simulator are internal (internal/README.md).
test_dir = ../internal/firmware/test

; What both boards build with; each adds its own BOOP_BOARD_* (src/board/config.h).
[common]
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -Iassets
    ; Bluetooth as Boop uses it: one Mac connected, as a peripheral that
    ; only advertises, with no pairing (PROTOCOL.md §2). NimBLE's defaults
    ; hold room for three connections and bonds, and build the central and
    ; observer roles; these give 3 KB of heap and 16 KB of flash back.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=2

; MicroTech MTR024QV01A (ESP32-D0WD-V3, 4 MB flash, no PSRAM).
[env:cyd24]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; One 3 MB app slot for the faces, voice and sound effects (DEVICE.md §5); the
; NVS partition sits where it did, so the touch calibration survives.
board_build.partitions = huge_app.csv
; The CH340 bridge on macOS's own driver can't do 921600 (DEVICE.md §7).
monitor_speed = 460800
upload_speed = 460800
extra_scripts = pre:tools/version.py
build_flags =
    ${common.build_flags}
    -DBOOP_BOARD_CYD24
; Each board builds board/, which is shared, and its own folder only.
build_src_filter = +<board/> -<board/amoled206/> +<render/> +<app/> +<voice/> +<main.cpp>
lib_deps =
    symlink://../linkkit/device
    lovyan03/LovyanGFX @ ^1.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.2.0

; Waveshare ESP32-S3-Touch-AMOLED-2.06 (ESP32-S3, 32 MB flash, 8 MB octal
; PSRAM; DEVICE.md §9): the same app on its own screen, touch and sound in
; src/board/amoled206/. USB is the S3's own (USB-Serial/JTAG, /dev/cu.usbmodem*).
;   firmware/tools/pio.sh run -e amoled206 -t upload
[env:amoled206]
extends = env:cyd24
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 460800
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DBOOP_BOARD_AMOLED206
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<board/> -<board/cyd24/> +<render/> +<app/> +<voice/> +<main.cpp>

; The Mac: firmware unit tests and the simulator (boop-sim). Only the pure
; C++ parts build here: render/, app/ and voice/, LinkKit without its
; Bluetooth, and the simulator's main from internal/firmware/sim/ (the
; filter is relative to src/).
[env:native]
platform = native
build_flags =
    -std=c++17
    -Isrc
    -Iassets
build_src_filter = +<render/> +<app/> +<voice/> +<../../internal/firmware/sim/>
test_build_src = yes
lib_deps =
    symlink://../linkkit/device
    bblanchon/ArduinoJson @ ^7.0.0
