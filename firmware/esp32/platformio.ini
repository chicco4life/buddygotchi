[platformio]
src_dir = firmware
# Bare `pio run` builds only the M5 envs (its historical behavior). The
# ws-amoled164* envs live on the pioarduino platform (Arduino core 3.x),
# and mixing the two platforms in one package tree makes PlatformIO
# thrash the shared framework-arduinoespressif32 package — build those
# through the isolating wrapper: tools/pio_ws.sh run -e ws-amoled164.
default_envs = m5stickc-plus, m5stickc-plus-debug

# Default env is what ships (the release workflow and OTA manifests build
# it): framework logs at WARN so customer serial captures show real errors
# without verbose spam, and flash isn't spent on debug strings. Use
# m5stickc-plus-debug for development. Project-level Serial.printf
# diagnostics ([heap], [ble], [guard]) are unaffected by this level.
[env:m5stickc-plus]
platform = espressif32 @ 6.13.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
extra_scripts = pre:tools/inject_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"
build_src_filter = +<*> +<buddies/> +<hal/> -<spike/>
lib_deps =
    m5stack/M5StickCPlus2 @ ^1.0.2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore = DFRobot_GP8XXX

[env:m5stickc-plus-debug]
extends = env:m5stickc-plus
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"

# Waveshare ESP32-S3-Touch-AMOLED-1.64 — the production "Boop Pebble"
# board. No official PlatformIO board def exists yet; the community-proven
# recipe is the S3 devkit board with the memory config overridden to match
# the hardware (16MB quad flash + 8MB octal PSRAM = qio_opi). Native USB
# CDC is the only serial path (no UART bridge chip), hence
# ARDUINO_USB_CDC_ON_BOOT — the device enumerates as /dev/cu.usbmodem*.
[env:ws-amoled164]
# pioarduino fork, not espressif32: Arduino_GFX's CO5300 driver needs
# Arduino core 3.x, which PlatformIO's own espressif32 platform never
# shipped. 55.03.39 = Arduino core 3.3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
extra_scripts = pre:tools/inject_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"
    -DBOARD_WS_AMOLED_164
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> +<buddies/> +<hal/> -<spike/>
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.0
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

# Bring-up spike: panel/touch/buttons/battery smoke test with none of the
# product firmware. Flash this first when a new board arrives.
[env:ws-amoled164-spike]
extends = env:ws-amoled164
build_src_filter = +<spike/> +<hal/>
