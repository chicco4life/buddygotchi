[platformio]
src_dir = firmware
default_envs = ws-amoled164

# Waveshare ESP32-S3-Touch-AMOLED-1.64 — the production "Boop Pebble"
# board, and since 2026-09-11 the only board. No official PlatformIO board
# def exists yet; the community-proven recipe is the S3 devkit board with
# the memory config overridden to match the hardware (16MB quad flash +
# 8MB octal PSRAM = qio_opi). Native USB CDC is the only serial path (no
# UART bridge chip), hence ARDUINO_USB_CDC_ON_BOOT — the device enumerates
# as /dev/cu.usbmodem*.
#
# The retired m5stickc-plus envs lived on PlatformIO's own espressif32
# platform, which never shipped Arduino core 3.x; keeping both in one
# package tree made PlatformIO thrash the shared
# framework-arduinoespressif32 package, which is why tools/pio_ws.sh
# exists. That conflict is gone with the M5, but the wrapper is still the
# supported entry point: it keeps PlatformIO's packages worktree-local, so
# parallel worktrees don't fight over one cache.
#   tools/pio_ws.sh run -e ws-amoled164
[env:ws-amoled164]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
extra_scripts = pre:tools/inject_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> +<buddies/> +<hal/> -<spike/>
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.0
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

# Bring-up spike: panel/touch/buttons/battery smoke test with none of the
# product firmware. Flash this first when a new board arrives.
[env:ws-amoled164-spike]
extends = env:ws-amoled164
build_src_filter = +<spike/> +<hal/>

# USB bench verification only. Never publish this image as an OTA release.
[env:ws-amoled164-usb-debug]
extends = env:ws-amoled164
build_flags =
    ${env:ws-amoled164.build_flags}
    -DBOOP_USB_ONLY=1
