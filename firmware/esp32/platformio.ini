[platformio]
src_dir = firmware

# Default env is what ships (the release workflow and OTA manifests build
# it): framework logs at WARN so customer serial captures show real errors
# without verbose spam, and flash isn't spent on debug strings. Use
# m5stickc-plus-debug for development. Project-level Serial.printf
# diagnostics ([heap], [ble], [guard]) are unaffected by this level.
[env:m5stickc-plus]
platform = espressif32 @ 6.13.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
extra_scripts = pre:tools/inject_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus2 @ ^1.0.2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore = DFRobot_GP8XXX

[env:m5stickc-plus-debug]
extends = env:m5stickc-plus
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DFW_VERSION=\"${sysenv.BUDDY_FW_VERSION}\"
    -DGIT_SHA=\"${sysenv.BUDDY_GIT_SHA}\"
