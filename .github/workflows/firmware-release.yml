name: Firmware Release

on:
  push:
    tags:
      - "fw-v*"

jobs:
  firmware:
    name: Build firmware artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Static check
        run: pio check || true
        working-directory: firmware/esp32

      - name: Build firmware
        env:
          BUDDY_FW_VERSION: ${{ github.ref_name }}
        run: |
          export BUDDY_FW_VERSION="${BUDDY_FW_VERSION#fw-v}"
          tools/pio_ws.sh run -e ws-amoled164
        working-directory: firmware/esp32

      - name: Generate release manifests
        run: |
          VERSION="${GITHUB_REF_NAME#fw-v}"
          python3 firmware/esp32/tools/generate_release_manifests.py \
            --version "$VERSION" \
            --base-url "https://adoptaboop.com/firmware" \
            --build-dir firmware/esp32/.pio/build/ws-amoled164 \
            --out-dir build/firmware

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/firmware/*
          body: |
            Firmware release ${{ github.ref_name }}.

            Manual gate before publishing:
            - OTA this binary on a real Waveshare ESP32-S3 AMOLED 1.64 board.
            - Confirm buddyctl.py ping --json reports fw == ${{ github.ref_name }} with the fw-v prefix stripped.
            - Open a landing PR publishing manifest.json, esp-web-tools-manifest.json, and the .bin files under archived/landing/public/firmware/ (served at https://adoptaboop.com/firmware/).
          draft: true
