name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Derive release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Tag must look like vX.Y.Z, got $GITHUB_REF_NAME" >&2
            exit 64
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          test -n "$CERT_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/buddygotchi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$CERT_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in imported certificate" >&2
            exit 1
          fi

          echo "APPLE_DEVELOPER_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Decode notarization and Sparkle keys
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$NOTARY_KEY_BASE64"
          test -n "$SPARKLE_PRIVATE_KEY_BASE64"
          test -n "$SPARKLE_PUBLIC_ED_KEY"

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_NOTARY_KEY_ID }}.p8"
          SPARKLE_PRIVATE_KEY_PATH="$RUNNER_TEMP/sparkle_ed25519"

          echo "$NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          echo "$SPARKLE_PRIVATE_KEY_BASE64" | base64 -D > "$SPARKLE_PRIVATE_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH" "$SPARKLE_PRIVATE_KEY_PATH"

          echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_PATH=$SPARKLE_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          echo "SPARKLE_PUBLIC_ED_KEY=$SPARKLE_PUBLIC_ED_KEY" >> "$GITHUB_ENV"

      - name: Run Swift tests
        run: swift test
        working-directory: app

      - name: Build app bundle
        run: scripts/release/build-app.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Sign app bundle
        run: scripts/release/sign-app.sh

      - name: Create DMG
        run: scripts/release/make-dmg.sh "$VERSION"

      - name: Notarize DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/release/notarize.sh "dist/Buddygotchi-$VERSION.dmg"

      - name: Generate Sparkle appcast
        run: scripts/release/generate-appcast.sh "$VERSION"

      - name: Write checksums
        run: shasum -a 256 "dist/Buddygotchi-$VERSION.dmg" dist/appcast.xml > dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Buddygotchi-$VERSION.dmg" \
            "dist/appcast.xml" \
            "dist/checksums.txt" \
            --title "Buddygotchi $VERSION" \
            --generate-notes

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
