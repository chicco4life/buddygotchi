name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Validate release scripts
        run: bash -n scripts/release/*.sh

      - name: Run Swift tests
        run: swift test
        working-directory: app

      - name: Build release app bundle
        run: scripts/release/build-app.sh 0.0.0 "$GITHUB_RUN_NUMBER"

      - name: Ad-hoc sign app bundle
        run: codesign --force --deep --sign - dist/Buddygotchi.app

      - name: Verify app bundle
        run: codesign --verify --deep --strict --verbose=4 dist/Buddygotchi.app
