name: CI

# Opt-in only: automatic failures were generating email on every push.
on:
  workflow_dispatch:

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - run: make test

  firmware:
    name: Firmware build and native tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install platformio
      - run: make fw
      - run: make fw-test
