name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build
        working-directory: app

      - name: Test
        run: swift test
        working-directory: app

      - name: Package app bundle
        run: make package
