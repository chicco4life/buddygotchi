name: App Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package signed app
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate configured; package.sh will build unsigned."
            exit 0
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Package
        env:
          BUDDY_VERSION: ${{ github.ref_name }}
          BUDDY_BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_PROFILE: ${{ secrets.NOTARYTOOL_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_FRAMEWORK_PATH: ${{ vars.SPARKLE_FRAMEWORK_PATH }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          export BUDDY_VERSION="${BUDDY_VERSION#v}"
          make package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*
          body_path: CHANGELOG.md
          draft: true

      - name: Appcast handoff
        run: |
          cat <<'MSG' >> "$GITHUB_STEP_SUMMARY"
          Packaged artifacts are attached to a draft release.

          Next manual gate:
          1. Download the signed artifact on a clean Mac and verify Gatekeeper launch.
          2. Run Sparkle generate_appcast with the private EdDSA key.
          3. Open a PR to the Pages repo updating /releases/appcast.xml.
          MSG
