name: App Release

on:
  push:
    tags:
      - "v*"

env:
  SPARKLE_VERSION: 2.6.4
  SPARKLE_SHA256: 50612a06038abc931f16011d7903b8326a362c1074dabccb718404ce8e585f0b

jobs:
  package:
    name: Package signed app
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate configured; package.sh will build unsigned."
            exit 0
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Download Sparkle
        env:
          SPARKLE_FRAMEWORK_OVERRIDE: ${{ vars.SPARKLE_FRAMEWORK_PATH }}
        run: |
          if [ -n "$SPARKLE_FRAMEWORK_OVERRIDE" ]; then
            echo "SPARKLE_FRAMEWORK_PATH=$SPARKLE_FRAMEWORK_OVERRIDE" >> "$GITHUB_ENV"
            echo "Using Sparkle framework from vars.SPARKLE_FRAMEWORK_PATH."
            exit 0
          fi

          archive="$GITHUB_WORKSPACE/Sparkle-$SPARKLE_VERSION.tar.xz"
          sparkle_dir="$GITHUB_WORKSPACE/sparkle"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $archive" | shasum -a 256 -c -
          rm -rf "$sparkle_dir"
          mkdir -p "$sparkle_dir"
          tar -xJf "$archive" -C "$sparkle_dir" ./Sparkle.framework ./bin/generate_appcast
          echo "SPARKLE_FRAMEWORK_PATH=$sparkle_dir/Sparkle.framework" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN_DIR=$sparkle_dir/bin" >> "$GITHUB_ENV"

      - name: Package
        env:
          BUDDY_VERSION: ${{ github.ref_name }}
          BUDDY_BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_PROFILE: ${{ secrets.NOTARYTOOL_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: make package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*
          body_path: CHANGELOG.md
          draft: true

      - name: Appcast handoff
        run: |
          cat <<'MSG' >> "$GITHUB_STEP_SUMMARY"
          Packaged artifacts are attached to a draft release.

          Next manual gate:
          1. Download the signed artifact on a clean Mac and verify Gatekeeper launch.
          2. Run app/tools/make-appcast.sh "$SPARKLE_BIN_DIR" <downloads-dir> with the private EdDSA key available to Sparkle.
          3. Open a landing PR updating the landing site appcast (landing/public/releases/appcast.xml) (served at https://adoptaboop.com/releases/appcast.xml).
          MSG
