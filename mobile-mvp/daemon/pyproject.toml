[project]
name = "buddy-daemon"
version = "0.1.0"
description = "Mobile Buddy MVP: local daemon + WebSocket bridge for hook-driven approvals"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
ble = [
    "bless>=0.2.6",
]

[project.scripts]
buddy-daemon = "buddy_daemon.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["buddy_daemon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
